document.addEventListener('click',e=>{if(e.target.closest('#wordBox')||e.target.closest('[data-word]'))return;$('wordBox').classList.add('hide')});const HIDDEN_CLOUD_KEY='rm_hidden_cloud_articles';function hiddenCloud(){try{return JSON.parse(localStorage.getItem(HIDDEN_CLOUD_KEY)||'{}')}catch{return {}}}function hideCloudArticle(id){const h=hiddenCloud();h[id]=true;localStorage.setItem(HIDDEN_CLOUD_KEY,JSON.stringify(h))}function unhideCloudArticle(id){const h=hiddenCloud();delete h[id];localStorage.setItem(HIDDEN_CLOUD_KEY,JSON.stringify(h))}function isCloudHidden(id){return !!hiddenCloud()[id]}
